<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>🎂 彼，生日快乐！🎉</title>
  <!-- 使用本地字体：字魂白鸽天行体（请确保系统已安装该字体） -->
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: radial-gradient(135deg, #f9fbd7 0%, #c7e78a 50%, #b7d44f 100%);
      font-family: '同一行书', serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1a2f0a;
      user-select: none;
    }

    .fullscreen-carousel {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at center, #f9ffce, #c6e27b 45%, #7cb02f 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slides-wrapper {
      display: flex;
      width: 100%;
      height: 100%;
      transition: none;
      will-change: transform;
    }

    .slide {
      flex: 0 0 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1.5rem 1rem;
      text-align: center;
      position: relative;
      overflow-y: auto;
    }

    /* 标题 */
    .photo-title {
      font-family: '同一行书', serif;
      font-size: clamp(2.4rem, 12vw, 4.8rem);
      font-weight: 700;
      color: #000;
      text-shadow: 0 3px 8px rgba(0,0,0,0.45);
      letter-spacing: 2px;
      margin-bottom: 0.4rem;
      padding: 0 0.3rem;
      line-height: 1.2;
      word-break: break-word;
      width: 100%;
      max-width: 800px;
    }

    .opening-title {
      font-family: '同一行书', serif;
      font-size: clamp(3rem, 14vw, 6rem);
      font-weight: 700;
      color: #000;
      text-shadow: 0 6px 18px rgba(0,0,0,0.45);
      letter-spacing: 4px;
      line-height: 1.2;
      text-align: center;
      padding: 1.5rem 2rem;
      max-width: 900px;
      width: 100%;
    }

    /* 图片容器 */
    .photo-frame {
      width: 90%;
      max-width: 700px;
      max-height: 70vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: rgba(235, 252, 203, 0.5);
      border-radius: 40px 12px 40px 12px;
      box-shadow: 0 20px 40px rgba(29, 82, 0, 0.35), 0 0 0 2px rgba(186, 235, 108, 0.4);
      padding: 0.8rem;
      backdrop-filter: blur(2px);
      transition: all 0.2s;
    }

    .photo-frame img {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 28px 8px 28px 8px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      display: block;
      background: #eef7c8;
    }

    /* 最后一页 (第7张) 特殊：全屏祝福 + 烟花背景 */
    .slide:last-child .photo-frame {
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      padding: 0;
    }
    .slide:last-child .photo-frame img {
      display: none;
    }

    /* 全屏祝福层 */
    .birthday-message {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at 30% 30%, #f6ffca, #d8f08d 40%, #8cbf34 100%);
      z-index: 10;
      padding: 2rem;
      text-align: center;
      border-radius: 0;
      color: #22410d;
      text-shadow: 0 0 40px rgba(136, 180, 55, 0.45);
      pointer-events: none;
    }

    .birthday-message h1 {
      font-family: '同一行书', serif;
      font-size: clamp(3.5rem, 18vw, 7rem);
      margin-bottom: 0.5rem;
      letter-spacing: 6px;
      color: #375d16;
      text-shadow: 0 0 30px #a1cf64, 0 0 60px #a1cf6480;
    }

    .birthday-message p {
      font-family: '同一行书', serif;
      font-size: clamp(1.6rem, 7vw, 3.2rem);
      line-height: 1.6;
      max-width: 800px;
      margin: 0.5rem 0;
      background: rgba(246, 255, 210, 0.65);
      padding: 0.8rem 1.8rem;
      border-radius: 60px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(140, 191, 52, 0.4);
      color: #000;
      text-shadow: 0 3px 8px rgba(0,0,0,0.35);
    }

    /* 导航提示 */
    .nav-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 0;
      width: 100%;
      text-align: center;
      font-size: clamp(1rem, 4vw, 1.8rem);
      color: #000;
      font-family: '同一行书', serif;
      text-shadow: 0 2px 10px rgba(0,0,0,0.45);
      letter-spacing: 4px;
      z-index: 20;
      background: linear-gradient(90deg, transparent, rgba(241, 255, 196, 0.45), transparent);
      padding: 0.6rem 0;
      backdrop-filter: blur(2px);
      pointer-events: none;
    }

    .nav-hint i {
      display: inline-block;
      margin: 0 12px;
      font-style: normal;
      background: rgba(241, 255, 196, 0.55);
      padding: 0 16px;
      border-radius: 40px;
      border: 1px solid rgba(158, 205, 77, 0.35);
      color: #000;
      font-family: '同一行书', serif;
    }

    /* 左右箭头 */
    .arrow-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      z-index: 30;
      font-size: 3rem;
      color: rgba(39, 72, 12, 0.9);
      background: rgba(246, 255, 206, 0.5);
      backdrop-filter: blur(6px);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(141, 206, 74, 0.35);
      box-shadow: 0 4px 20px rgba(40,82,10,0.22);
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255,255,255,0.7);
      user-select: none;
    }

    .arrow-nav:hover {
      background: rgba(217, 245, 147, 0.75);
      color: #2a4f10;
      border-color: rgba(187, 229, 100, 0.65);
      transform: translateY(-50%) scale(1.06);
    }

    .arrow-left { left: 1.5rem; }
    .arrow-right { right: 1.5rem; }

    .video-slide {
      padding: 2rem 1.2rem;
      gap: 1rem;
    }

    .video-frame {
      width: min(780px, 90%);
      max-width: 780px;
      max-height: 70vh;
      padding: 0.8rem;
      background: rgba(235, 252, 203, 0.5);
      border-radius: 40px 12px 40px 12px;
      box-shadow: 0 20px 40px rgba(29, 82, 0, 0.35), 0 0 0 2px rgba(186, 235, 108, 0.4);
      backdrop-filter: blur(2px);
      position: relative;
      overflow: hidden;
    }

    .video-frame video {
      width: 100%;
      height: auto;
      max-height: 65vh;
      object-fit: contain;
      border-radius: 28px 8px 28px 8px;
      background: #000;
      display: block;
      position: relative;
      z-index: 1;
    }

    .video-fallback {
      position: absolute;
      inset: 0.8rem;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.7rem;
      padding: 1.2rem;
      background: linear-gradient(135deg, rgba(248, 255, 214, 0.95), rgba(210, 242, 132, 0.95));
      border-radius: 28px 8px 28px 8px;
      color: #21410a;
      text-align: center;
      font-family: '同一行书', serif;
      font-size: clamp(1.2rem, 3.8vw, 2rem);
      line-height: 1.5;
      z-index: 2;
      box-shadow: inset 0 0 0 1px rgba(152, 201, 83, 0.24);
    }

    .video-fallback .emoji {
      font-size: 2.1rem;
    }

    .video-note {
      margin-top: 0.8rem;
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #000;
      font-family: '同一行书', serif;
      text-shadow: 0 3px 6px rgba(0,0,0,0.35);
      opacity: 0.95;
    }

    @media (max-width: 640px) {
      .video-frame { width: 94%; max-height: 60vh; padding: 0.5rem; }
      .video-frame video { max-height: 50vh; }
    }

    /* 烟花画布 */
    #fireworks-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* 移动端适配 */
    @media (max-width: 640px) {
      .photo-title { font-size: clamp(1.8rem, 10vw, 3.2rem); }
      .photo-frame { width: 94%; max-height: 60vh; padding: 0.5rem; }
      .photo-frame img { max-height: 50vh; }
      .arrow-nav { width: 48px; height: 48px; font-size: 2.2rem; opacity: 0.7; }
      .arrow-left { left: 0.6rem; }
      .arrow-right { right: 0.6rem; }
      .birthday-message p { font-size: clamp(1.2rem, 5vw, 2.2rem); padding: 0.4rem 1rem; }
      .birthday-message h1 { font-size: clamp(2.8rem, 14vw, 5rem); }
      .nav-hint { bottom: 1.2rem; font-size: clamp(0.8rem, 3.5vw, 1.2rem); }
      .nav-hint i { margin: 0 6px; padding: 0 10px; }
    }

    .slide::-webkit-scrollbar { display: none; }
    .slide { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>

<div class="fullscreen-carousel" id="carousel">
  <div class="slides-wrapper" id="slidesWrapper">

    <!-- 0. 开场标题 -->
    <div class="slide" data-index="0">
      <div class="opening-title">生日快乐，彼小猫</div>
    </div>

	<!-- 1. 初见 -->
    <div class="slide" data-index="1">
      <div class="photo-title">初遇</div>
      <div class="photo-frame"><img src="IMG_2107.JPG" alt="花之日"></div>
    </div>
    <!-- 1. 花之日 -->
    <div class="slide" data-index="1">

    <!-- 小猫的睡姿 -->

    <!-- 亲亲 -->

    </div>
    <!-- 丑丑 -->

      <div class="photo-title">丑丑</div>

    <!-- 大鸟 -->

    <!-- 2. 小王子 · B612 -->
    <div class="slide" data-index="2">
      <div class="photo-title">🌟 小王子 · B612</div>
      <div class="photo-frame"><img src="2.jpeg" alt="小王子- B612号小行星"></div>
    </div>
    <!-- 2. 小王子 · 看太阳 -->
    <div class="slide" data-index="2">
      <div class="photo-title">☀️ 小王子 · 看太阳</div>
      <div class="photo-frame"><img src="看太阳.jpeg" alt="小王子- B612号小行星"></div>

    <!-- 自由 -->
    <div class="slide" data-index="2">

    <!-- 3. 四叶草 -->

    <div class="slide" data-index="4">

    <!-- 思念 -->
    <div class="slide" data-index="2">

    <!-- 5. 偷拍 -->
    <div class="slide" data-index="5">
      <div class="photo-title">📸 偷拍</div>

    <!-- 6. 睡觉时间到 -->
    <div class="slide" data-index="6">

        </video>

    </div>

    <!-- 已将 Sky 17 放到最后一页 -->

    <!-- 11. 全屏祝福层（最后一页） -->
    <div class="slide" data-index="11">
      <div class="photo-frame video-frame">
        <video id="lastVideo" autoplay muted playsinline preload="auto" poster="7.JPG" onerror="window.__showLastVideoFallback && window.__showLastVideoFallback()">
          <source src="Sky 17.mp4" type="video/mp4">
          您的浏览器不支持视频播放。
        </video>
        <div class="video-fallback" id="lastVideoFallback">

  <!-- 导航箭头 -->
  <div class="arrow-nav arrow-left" id="prevBtn">‹</div>
  <div class="arrow-nav arrow-right" id="nextBtn">›</div>

  <!-- 底部提示 -->

<!-- 背景音乐 -->
<audio id="bgMusic" autoplay loop preload="auto">
  <source src="music.mp3" type="audio/mpeg">
  您的浏览器不支持音频播放。
</audio>

<script>
  (function() {
    // ---- 核心变量 ----
    const slidesWrapper = document.getElementById('slidesWrapper');
    const slides = document.querySelectorAll('.slide');
    const totalSlides = slides.length;
    let currentIndex = 0;
    let isTransitioning = false;

    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const music = document.getElementById('bgMusic');
    const lastVideo = document.getElementById('lastVideo');
    const birthdayMessageEl = document.querySelector('.birthday-message');
    const lastVideoFallback = document.getElementById('lastVideoFallback');

    function showLastVideoFallback() {
      if (lastVideoFallback) {
        lastVideoFallback.style.display = 'flex';
      }
      if (lastVideo) {
        lastVideo.style.display = 'none';
      }
    }

    window.__showLastVideoFallback = showLastVideoFallback;

    // 点击页面恢复音频播放
    document.addEventListener('click', function resumeAudio() {
      if (music.paused) {
        music.play().catch(() => {});
      }
    }, { once: false });

    // 切换到指定幻灯片
    function goToSlide(index) {
      if (isTransitioning || index === currentIndex) return;
      if (index < 0) index = 0;
      if (index >= totalSlides) index = totalSlides - 1;
      isTransitioning = true;
      currentIndex = index;
      slidesWrapper.style.transform = `translateX(-${currentIndex * 100}%)`;

      // 隐藏/显示底部按键提示：仅在第一页显示
      const navHint = document.querySelector('.nav-hint');
      if (navHint) navHint.style.display = (currentIndex === 0) ? 'block' : 'none';

      // 首页无左箭头，最后一页无右箭头
      if (prevBtn) prevBtn.style.display = (currentIndex === 0) ? 'none' : 'flex';
      if (nextBtn) nextBtn.style.display = (currentIndex === totalSlides - 1) ? 'none' : 'flex';

      // 处理烟花：最后一页显示并启动，其他页隐藏并清除
      const canvas = document.getElementById('fireworks-canvas');
      if (currentIndex === totalSlides - 1) {
        if (canvas) {
          canvas.style.display = 'block';
          initFireworks();
        }
        // 最后一页：允许祝福层接收点击以播放/显示视频
        if (birthdayMessageEl) {
          birthdayMessageEl.style.pointerEvents = 'auto';
        }
        if (lastVideo) {
          // 确保视频准备好，保持静音直到用户点击祝福文字
          lastVideo.muted = true;
          lastVideo.pause();
        }
      } else {
        if (canvas) {
          canvas.style.display = 'none';
          const ctx = canvas.getContext('2d');
          if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
          fireworksActive = false;
          if (animationFrame) {
            cancelAnimationFrame(animationFrame);
            animationFrame = null;
          }
          if (window._fireworkFrame) {
            cancelAnimationFrame(window._fireworkFrame);
            window._fireworkFrame = null;
          }
        }
        if (birthdayMessageEl) {
          birthdayMessageEl.style.pointerEvents = 'none';
        }
      }

      setTimeout(() => {
        isTransitioning = false;
      }, 520);
    }

    function prevSlide() { if (currentIndex > 0) goToSlide(currentIndex - 1); }
    function nextSlide() { if (currentIndex < totalSlides - 1) goToSlide(currentIndex + 1); }

    // ---- 事件绑定 ----
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { e.preventDefault(); prevSlide(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); nextSlide(); }
    });

    // 触摸滑动
    let touchStartX = 0;
    const carousel = document.getElementById('carousel');
    carousel.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    carousel.addEventListener('touchend', (e) => {
      const touchEndX = e.changedTouches[0].screenX;
      const diff = touchStartX - touchEndX;
      if (Math.abs(diff) > 40) {
        diff > 0 ? nextSlide() : prevSlide();
      }
    }, { passive: true });

    // ---- 🎆 烟花系统 (增强版) ----
    let fireworksActive = false;
    let particles = [];
    let animationFrame = null;

    function initFireworks() {
      const canvas = document.getElementById('fireworks-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;

      // 如果已有动画，先停止
      if (animationFrame) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
      }
      particles = [];
      fireworksActive = true;

      // 设置画布尺寸
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;

      const colors = ['#ffd700', '#ff6b6b', '#ff9f43', '#f368e0', '#48dbfb', '#1dd1a1', '#feca57', '#ff9ff3', '#ff4757', '#2ed573'];

      class Particle {
        constructor(x, y, color) {
          this.x = x;
          this.y = y;
          this.color = color || colors[Math.floor(Math.random() * colors.length)];
          this.radius = Math.random() * 4 + 2;
          this.vx = (Math.random() - 0.5) * 10;
          this.vy = (Math.random() - 0.5) * 10 - 4;
          this.alpha = 1;
          this.life = 1;
          this.damping = 0.99;
          this.gravity = 0.08;
        }
        update() {
          this.vx *= this.damping;
          this.vy *= this.damping;
          this.vy += this.gravity;
          this.x += this.vx;
          this.y += this.vy;
          this.alpha -= 0.015;
          this.life -= 0.015;
          this.radius *= 0.995;
        }
        draw() {
          ctx.save();
          ctx.globalAlpha = Math.max(this.alpha, 0);
          ctx.beginPath();
          ctx.arc(this.x, this.y, Math.max(this.radius, 0.5), 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.shadowColor = this.color;
          ctx.shadowBlur = 20;
          ctx.fill();
          ctx.restore();
        }
      }

      function createExplosion(cx, cy) {
        const count = 60 + Math.floor(Math.random() * 50);
        const color = colors[Math.floor(Math.random() * colors.length)];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 6 + 2;
          const p = new Particle(cx, cy, color);
          p.vx = Math.cos(angle) * speed;
          p.vy = Math.sin(angle) * speed - 1.5;
          p.radius = Math.random() * 5 + 2;
          particles.push(p);
        }
      }

      function launchFirework() {
        if (!fireworksActive) return;
        const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
        const y = canvas.height * 0.2 + Math.random() * canvas.height * 0.4;
        createExplosion(x, y);
      }

      function animate() {
        if (!fireworksActive) {
          // 清理画布
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          animationFrame = null;
          return;
        }
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.update();
          if (p.alpha <= 0.02 || p.life <= 0) {
            particles.splice(i, 1);
          } else {
            p.draw();
          }
        }

        // 生成新烟花
        if (particles.length < 60) {
          launchFirework();
          if (Math.random() < 0.25) launchFirework();
        }

        animationFrame = requestAnimationFrame(animate);
        window._fireworkFrame = animationFrame;
      }

      // 初始生成几朵
      for (let i = 0; i < 4; i++) {
        setTimeout(() => { if (fireworksActive) launchFirework(); }, i * 400 + 100);
      }

      animate();

      // 窗口尺寸变化重置
      function resizeCanvas() {
        if (!fireworksActive) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeCanvas);
      // 存储清理引用
      canvas._resizeHandler = resizeCanvas;
    }

    // ---- 初始加载 ----
    window.addEventListener('load', function() {
      // 默认显示第一页
      goToSlide(0);
      // 隐藏烟花画布
      const canvas = document.getElementById('fireworks-canvas');
      if (canvas) {
        canvas.style.display = 'none';
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      // 尝试播放音乐
      music.play().catch(() => {});

      if (lastVideo) {
        lastVideo.addEventListener('error', showLastVideoFallback);
        lastVideo.addEventListener('loadedmetadata', function() {
          if (lastVideo.videoWidth === 0) {
            showLastVideoFallback();
          }
        });
      }

      // 祝福层点击：隐藏祝福并播放最后的视频（解除静音）
      if (birthdayMessageEl && lastVideo) {
        birthdayMessageEl.addEventListener('click', function() {
          birthdayMessageEl.style.display = 'none';
          if (lastVideo.style.display === 'none') {
            return;
          }
          try {
            lastVideo.muted = false;
            lastVideo.play().catch(() => {});
          } catch (e) {}
        });
      }
    });

    // 窗口变化时重置烟花画布尺寸 (如果可见)
    window.addEventListener('resize', function() {
      const canvas = document.getElementById('fireworks-canvas');
      if (canvas && canvas.style.display !== 'none') {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
    });

  })();
</script>

</body>
</html>
